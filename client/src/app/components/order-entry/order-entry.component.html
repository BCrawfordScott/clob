<h2>Order Entry</h2>

<form #placeForm="ngForm" (ngSubmit)="onPlaceOrder(placeForm)">
  <div>
    <label for="ticker">Ticker</label>
    <input id="ticker" name="ticker" ngModel required placeholder="AAPL">
  </div>
  <div>
    <label for="side">Side</label>
    <select id="side" name="side" ngModel required>
      <option value="buy">Buy</option>
      <option value="sell">Sell</option>
    </select>
  </div>
  <div>
    <label for="price">Price</label>
    <input id="price" name="price" ngModel required type="number" step="0.01" min="0.01">
  </div>
  <div>
    <label for="quantity">Quantity</label>
    <input id="quantity" name="quantity" ngModel required type="number" min="1" step="1">
  </div>
  <button type="submit" [disabled]="placeForm.invalid">Place Order</button>
</form>

<div *ngIf="lastOrderId$ | async as orderId" class="last-order-id">
  Last order ID: <code>{{ orderId }}</code>
</div>

<h3>Subscribe to Book</h3>
<div class="subscribe-row">
  <input #subscribeInput placeholder="e.g. AAPL">
  <button type="button" (click)="onSubscribeBook(subscribeInput)">Subscribe</button>
</div>

<h3>Cancel Order</h3>
<form #cancelForm="ngForm" (ngSubmit)="onCancelOrder(cancelForm)">
  <div>
    <label for="orderId">Order ID</label>
    <input id="orderId" name="orderId" ngModel required placeholder="paste order ID">
  </div>
  <button type="submit" [disabled]="cancelForm.invalid">Cancel Order</button>
</form>
