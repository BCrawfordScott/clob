<h2>Order Entry</h2>

<form #placeForm="ngForm" (ngSubmit)="onPlaceOrder(placeForm)">
  <div>
    <label for="ticker">Ticker</label>
    <input id="ticker" name="ticker" ngModel required placeholder="AAPL">
  </div>
  <div>
    <label for="side">Side</label>
    <select id="side" name="side" ngModel="buy" required>
      <option value="buy">Buy</option>
      <option value="sell">Sell</option>
    </select>
  </div>
  <div>
    <label for="price">Price</label>
    <input id="price" name="price" ngModel required type="number" step="0.01" min="0.01">
  </div>
  <div>
    <label for="quantity">Quantity</label>
    <input id="quantity" name="quantity" ngModel required type="number" min="1" step="1">
  </div>
  <button type="submit" [disabled]="placeForm.invalid">Place Order</button>
</form>

<h3>Subscribe to Book</h3>
<div class="subscribe-row">
  <input #subscribeInput placeholder="e.g. AAPL">
  <button type="button" (click)="onSubscribeBook(subscribeInput)">Subscribe</button>
</div>

<h3>Open Orders</h3>
<ng-container *ngIf="openOrders$ | async as orders">
  <p *ngIf="orders.length === 0" class="empty">No open orders</p>
  <table *ngIf="orders.length > 0" class="open-orders">
    <thead>
      <tr>
        <th>Side</th>
        <th>Ticker</th>
        <th>Price</th>
        <th>Qty</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td [class]="'order-side--' + order.side">{{ order.side | uppercase }}</td>
        <td>{{ order.ticker }}</td>
        <td>{{ order.price | number:'1.2-2' }}</td>
        <td>{{ order.remainingQty }}/{{ order.quantity }}</td>
        <td>
          <button type="button" class="cancel-btn" (click)="cancelOrder(order.orderId)">Cancel</button>
        </td>
      </tr>
    </tbody>
  </table>
</ng-container>
